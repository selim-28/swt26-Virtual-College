# Konfiguration des Fremdsystems (backend_send).

spring.application.name=backend_send
server.port=8084


# MQTT: backend_send publiziert in dasselbe Topic, das backend_receive abonniert.
# Im Docker-Betrieb wird die Broker-Adresse ueber MQTT_BROKER_URL ueberschrieben.
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=backend_send
mqtt.topic=virtualcollege/data
