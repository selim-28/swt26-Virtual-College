# ============================================================
#  EINSTELLUNGS-DATEI von Backend 2 ("External System Server"
#  = Fremdsystem ÖPNV / Studierendenwerk)
# ------------------------------------------------------------
#  Aufbau jeder Zeile:   schluessel=wert
#  Zeilen mit # am Anfang sind Kommentare (nur Erklaerung,
#  werden vom Programm ignoriert).
# ============================================================


# --- Name dieses Backends ---
# Interner Name der Anwendung. Taucht z.B. in Log-Ausgaben auf,
# damit man erkennt, von welchem Backend eine Meldung kommt.
spring.application.name=backend_send

# --- Port (die "Tuernummer" des Servers) ---
# Erreichbar unter http://localhost:8081 .
# Dieses Backend hat ABSICHTLICH die 8081, weil Backend 1 schon
# die 8080 benutzt. Zwei Server duerfen nicht dieselbe Tuer haben.
server.port=8084


# ============================================================
#  Verbindung zum MQTT-Broker (Mosquitto)
#  Wird erst in einem SPAETEREN Praktikum benutzt. Hier nur
#  vorbereitet, damit spaeter nichts fehlt.
# ============================================================

# Adresse des Mosquitto-Brokers (gleicher Broker wie bei Backend 1!).
#   tcp://       = Verbindungsart
#   localhost    = laeuft auf dem eigenen Rechner
#   1883         = Standard-Tuer (Port) von MQTT/Mosquitto
mqtt.broker.url=tcp://localhost:1883

# Eindeutiger Anmelde-Name dieses Backends beim Broker.
# Muss sich von dem des anderen Backends unterscheiden.
mqtt.client.id=backend_send

# "Topic" = der Themen-Kanal beim Broker (wie ein Betreff/Postfach).
# Backend 2 SCHREIBT seine Daten in dieses Topic, Backend 1 LIEST sie
# aus demselben Topic. Deshalb steht hier DERSELBE Name wie bei Backend 1.
mqtt.topic=virtualcollege/data
