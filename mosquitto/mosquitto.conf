# ============================================================
#  Konfiguration fuer den Mosquitto-MQTT-Broker (Test-Setup)
# ------------------------------------------------------------
#  Diese Datei wird vom "mosquitto"-Container in docker-compose.yml
#  benutzt. Sie ist BEWUSST minimal: gerade so viel, dass der Broker
#  im lokalen Test-Setup laeuft und erreichbar ist.
#  Zeilen mit # sind Kommentare (Erklaerung, werden ignoriert).
# ============================================================

# "listener 1883" = Mosquitto lauscht auf Port 1883 (Standard-MQTT-Tuer)
#  auf ALLEN Netzwerk-Adressen, damit die anderen Container und dein
#  Rechner ihn erreichen koennen.
listener 1883

# "allow_anonymous true" = Verbindungen OHNE Benutzername/Passwort erlauben.
#  Fuer eine lokale Test-Umgebung ist das voellig in Ordnung.
#  In einer echten Produktiv-Umgebung wuerde man hier Anmeldedaten verlangen.
allow_anonymous true
