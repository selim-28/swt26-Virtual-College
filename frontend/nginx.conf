server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mensa-Daten kommen aus backend_receive.
    location /api/mensa/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/api/mensa/;
    }

    # OePNV-Daten kommen ebenfalls aus backend_receive.
    location /api/transit/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/api/transit/;
    }

    # Campus-Karte und Reservierungen laufen ueber backend_receive.
    location /api/campus/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/api/campus/;
    }

    # Pinwand-Posts und Likes werden in backend_receive gespeichert.
    location /api/pinwand/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/api/pinwand/;
    }

    # Registrierung und Login (Authentifizierung) laufen ueber backend_receive.
    location /api/auth/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/api/auth/;
    }

    # Die Simulation startet im Sender-Backend.
    location /api/simulation/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_send:8084/api/simulation/;
    }

    # Schnittstellen-Doku (OpenAPI/Swagger) von backend_receive,
    # damit alles ueber EINEN Einstieg (Port 8090) erreichbar ist.
    # (Die Doku von backend_send gibt es direkt unter localhost:8084.)
    location /swagger-ui/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/swagger-ui/;
    }
    location = /swagger-ui.html {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/swagger-ui.html;
    }
    location /v3/api-docs {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://backend_receive:8083/v3/api-docs;
    }

    # React-Routen fallen auf index.html zurueck.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
