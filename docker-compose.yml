# Startet die komplette Anwendung mit einem Befehl:
#
#     docker compose up --build     (stoppen: docker compose down)
#
# Frontend, beide Backends, MQTT-Broker, Datenbank und Adminer.
# Ausser Docker muss dafuer nichts installiert sein.

services:

  # Nginx liefert die gebaute React-App aus und leitet /api an die Backends weiter.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: vc_frontend
    ports:
      - "8090:80"
    depends_on:
      - backend_receive
      - backend_send

  # Application Server: liefert dem Frontend die Daten und persistiert sie.
  backend_receive:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        MODULE: backend_receive
    container_name: vc_backend_receive
    ports:
      - "8083:8083"
    # Im Docker-Netz heisst der Broker "mosquitto", nicht localhost.
    # Die SPRING_DATASOURCE_*-Werte schalten von H2 auf MariaDB um.
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/virtualcollege
      SPRING_DATASOURCE_USERNAME: vcuser
      SPRING_DATASOURCE_PASSWORD: vcpass
    # Erst starten, wenn die Datenbank wirklich bereit ist.
    depends_on:
      mosquitto:
        condition: service_started
      mariadb:
        condition: service_healthy

  # Simuliertes Fremdsystem (OePNV / Studierendenwerk).
  backend_send:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        MODULE: backend_send
    container_name: vc_backend_send
    ports:
      - "8084:8084"
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      - mosquitto

  # MQTT-Broker: backend_send publiziert, backend_receive abonniert.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vc_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Datenbank aus dem Verteilungsdiagramm. Die Zugangsdaten muessen zu den
  # SPRING_DATASOURCE_*-Werten von backend_receive passen.
  mariadb:
    image: mariadb:11
    container_name: vc_mariadb
    environment:
      MARIADB_DATABASE: virtualcollege
      MARIADB_USER: vcuser
      MARIADB_PASSWORD: vcpass
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_data:/var/lib/mysql

  # Optional: Datenbank im Browser ansehen unter http://localhost:8091
  # (Server: mariadb, Benutzer: vcuser, Passwort: vcpass, DB: virtualcollege).
  adminer:
    image: adminer:5
    container_name: vc_adminer
    ports:
      - "8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      - mariadb

# Damit die Daten einen "docker compose down" ueberleben.
volumes:
  mariadb_data:
