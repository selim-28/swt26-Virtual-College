# ============================================================
#  EINSTELLUNGS-DATEI von Backend 1 ("Application Server")
# ------------------------------------------------------------
#  Aufbau jeder Zeile:   schluessel=wert
#  Zeilen mit # am Anfang sind Kommentare (nur Erklaerung,
#  werden vom Programm ignoriert).
#  ACHTUNG: // ist hier KEIN Kommentar! Nur # funktioniert.
# ============================================================


# --- Name dieses Backends ---
# Interner Name der Anwendung. Taucht z.B. in Log-Ausgaben auf,
# damit man erkennt, von welchem Backend eine Meldung kommt.
spring.application.name=backend_receive

# --- Port (die "Tuernummer" des Servers) ---
# Ein Server ist ueber eine Adresse + Port erreichbar, z.B.
# http://localhost:8083 . "localhost" = der eigene Rechner,
# "8083" = die Tuer, an der DIESES Backend lauscht.
# WICHTIG: Jeder Server braucht eine EIGENE Tuer. Deshalb hat
# Backend 1 (receive) die 8083 und Backend 2 (send) die 8084 (sonst Konflikt).
server.port=8083


# ============================================================
#  Verbindung zum MQTT-Broker (Mosquitto)
#  Diese Werte werden jetzt WIRKLICH benutzt: backend_receive
#  abonniert (subscribe) das Topic und empfaengt die Daten, die
#  backend_send hineinschreibt (publish). Siehe Klasse MqttEmpfaenger.
# ============================================================

# Adresse des Mosquitto-Brokers.
#   tcp://       = Verbindungsart
#   localhost    = laeuft auf dem eigenen Rechner
#   1883         = Standard-Tuer (Port) von MQTT/Mosquitto
mqtt.broker.url=tcp://localhost:1883

# Eindeutiger Name, mit dem sich DIESES Backend beim Broker anmeldet.
# Jeder Teilnehmer am Broker braucht einen eigenen Namen.
mqtt.client.id=backend_receive

# "Topic" = der Themen-Kanal beim Broker (wie ein Betreff/Postfach).
# Backend 2 schreibt seine Daten in dieses Topic, Backend 1 liest sie
# aus demselben Topic. Beide muessen also denselben Namen verwenden!
mqtt.topic=virtualcollege/data


# ============================================================
#  SCHRITT 3: Datenbank
# ------------------------------------------------------------
#  Standardmaessig benutzen wir H2 - eine winzige Datenbank IM
#  Arbeitsspeicher. Vorteil: das Backend laeuft ueberall sofort,
#  ohne dass man eine Datenbank installieren muss.
#  Im DOCKER-Setup werden diese Werte per Umgebungsvariable
#  (SPRING_DATASOURCE_URL usw.) auf die echte MariaDB umgestellt.
# ============================================================

# Adresse der Datenbank. "h2:mem" = im Arbeitsspeicher.
spring.datasource.url=jdbc:h2:mem:virtualcollege;DB_CLOSE_DELAY=-1
# Benutzername/Passwort der H2-Datenbank (Standard: sa / leer).
spring.datasource.username=sa
spring.datasource.password=

# "ddl-auto=update" = Spring/Hibernate legt die Tabellen automatisch an
# bzw. passt sie an die Java-Klassen (@Entity) an. Praktisch fuers Lernen.
spring.jpa.hibernate.ddl-auto=update
# Kein "Open Session in View" - sauberer fuer REST-Anwendungen.
spring.jpa.open-in-view=false


# ============================================================
#  Fehlermeldungen im JSON anzeigen
# ------------------------------------------------------------
#  Damit das Frontend bei Login-/Registrier-Fehlern den Klartext
#  sieht (z.B. "E-Mail oder Passwort ist falsch."), statt nur
#  einer leeren 401. Fuer eine Lern-/Demo-App ist das praktisch.
# ============================================================
server.error.include-message=always
