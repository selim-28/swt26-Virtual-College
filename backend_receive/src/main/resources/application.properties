# Konfiguration des Application Servers (backend_receive).

spring.application.name=backend_receive
server.port=8083


# MQTT: backend_receive abonniert das Topic, in das backend_send publiziert.
# Im Docker-Betrieb wird die Broker-Adresse ueber MQTT_BROKER_URL ueberschrieben.
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=backend_receive
mqtt.topic=virtualcollege/data


# Standard ist H2 im Arbeitsspeicher, damit das Backend ohne Docker startet.
# Im Docker-Betrieb schalten die SPRING_DATASOURCE_*-Variablen auf MariaDB um.
spring.datasource.url=jdbc:h2:mem:virtualcollege;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# Fehlermeldungen im JSON mitschicken, damit das Frontend sie anzeigen kann.
server.error.include-message=always


# JWT-Signatur. Der Standardwert ist ausschliesslich fuer die Entwicklung gedacht
# und muss produktiv ueber APP_JWT_SECRET gesetzt werden (HS256: min. 32 Zeichen).
app.jwt.secret=${APP_JWT_SECRET:dev-only-geheimer-schluessel-bitte-in-produktion-per-env-ersetzen}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}
