# ============================================================
#  EINSTELLUNGS-DATEI von Backend 1 ("Application Server")
# ------------------------------------------------------------
#  Aufbau jeder Zeile:   schluessel=wert
#  Zeilen mit # am Anfang sind Kommentare (nur Erklaerung,
#  werden vom Programm ignoriert).
#  ACHTUNG: // ist hier KEIN Kommentar! Nur # funktioniert.
# ============================================================


# --- Name dieses Backends ---
# Interner Name der Anwendung. Taucht z.B. in Log-Ausgaben auf,
# damit man erkennt, von welchem Backend eine Meldung kommt.
spring.application.name=backend_receive

# --- Port (die "Tuernummer" des Servers) ---
# Ein Server ist ueber eine Adresse + Port erreichbar, z.B.
# http://localhost:8080 . "localhost" = der eigene Rechner,
# "8080" = die Tuer, an der DIESES Backend lauscht.
# WICHTIG: Jeder Server braucht eine EIGENE Tuer. Deshalb hat
# Backend 1 die 8080 und Backend 2 die 8081 (sonst Konflikt).
server.port=8083


# ============================================================
#  Verbindung zum MQTT-Broker (Mosquitto)
#  Diese Werte werden erst in einem SPAETEREN Praktikum benutzt
#  (wenn die MQTT-Vorlesung dran war). Wir tragen sie schon ein,
#  damit alles vorbereitet ist.
# ============================================================

# Adresse des Mosquitto-Brokers.
#   tcp://       = Verbindungsart
#   localhost    = laeuft auf dem eigenen Rechner
#   1883         = Standard-Tuer (Port) von MQTT/Mosquitto
mqtt.broker.url=tcp://localhost:1883

# Eindeutiger Name, mit dem sich DIESES Backend beim Broker anmeldet.
# Jeder Teilnehmer am Broker braucht einen eigenen Namen.
mqtt.client.id=backend_receive

# "Topic" = der Themen-Kanal beim Broker (wie ein Betreff/Postfach).
# Backend 2 schreibt seine Daten in dieses Topic, Backend 1 liest sie
# aus demselben Topic. Beide muessen also denselben Namen verwenden!
mqtt.topic=virtualcollege/data
